[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weather_agents"]

[project]
name = "agent-sdks"
version = "0.1.0"
description = "OpenAI Agents SDK と Deep Agents (LangChain) の機能比較プロジェクト"
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "deepagents>=0.6.7",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.2",
    "openai-agents>=0.17.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.26.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
